# BMO runtime directory.
#
# /run is a tmpfs that is emptied on every boot. bmo-voice.service binds
# /run/bmo via ReadWritePaths, so the directory MUST exist before the service
# starts or systemd aborts mount-namespace setup (status=226/NAMESPACE) and the
# assistant never comes up after a reboot. systemd-tmpfiles recreates it on
# every boot. It is also the shared drop point for the external presence/DND
# sidecars, which write /run/bmo/presence and /run/bmo/dnd.
d /run/bmo 0755 bmo bmo -
